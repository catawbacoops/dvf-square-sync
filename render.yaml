services:
  - type: web
    name: dvf-square-sync
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 300 --workers 1 --threads 4"
    envVars:
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: CURRENCY
        value: USD
